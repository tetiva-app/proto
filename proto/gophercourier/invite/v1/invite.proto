syntax = "proto3";

package gophercourier.invite.v1;

import "google/protobuf/timestamp.proto";

service InviteService {
  // Org-side RPCs — gated by org:invite_members.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);

  // Accepter-side RPC — auth required (logged-in user). Replaces
  // "POST /v1/orgs/join" from spec [04]. The new access token reflects the
  // accepted Org as active_org_id.
  rpc JoinOrg(JoinOrgRequest) returns (JoinOrgResponse);
}

message Invite {
  string id = 1;
  string org_id = 2;
  string email = 3;                                // empty for shareable
  string role_id = 4;
  string invited_by_user_id = 5;
  int32 max_uses = 6;
  int32 used_count = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp revoked_at = 9;        // unset for active
  google.protobuf.Timestamp created_at = 10;
  string status = 11;                              // "pending" | "expired" | "exhausted" | "revoked"
}

message CreateInviteRequest {
  string org_id = 1;
  string invitee_email = 2;                        // empty → shareable
  string role_id = 3;                              // empty → org default member role
  int32 max_uses = 4;                              // 0 → 1
  int64 expires_in_seconds = 5;                    // 0 → server default (7d)
}

message CreateInviteResponse {
  Invite invite = 1;
  string token = 2;                                // raw "gci_..." — ONLY moment exposed
  string invite_url = 3;
}

message RevokeInviteRequest {
  string org_id = 1;
  string invite_id = 2;
}

message RevokeInviteResponse {}

message ListInvitesRequest {
  string org_id = 1;
  // status filter: "" | "pending" | "expired" | "exhausted" | "revoked"
  string status = 2;
  int32 limit = 3;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
}

message JoinOrgRequest {
  string token = 1;
}

message JoinOrgResponse {
  string org_id = 1;
  string role_id = 2;
  string membership_id = 3;
  bool already_joined = 4;
  // Re-issued access token reflects the new active_org_id. Refresh token unchanged.
  string new_access_token = 5;
}
