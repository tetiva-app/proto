syntax = "proto3";

package gophercourier.billing.v1;

import "google/protobuf/timestamp.proto";

// Self-service purchase. Every RPC requires org:manage_billing except
// GetSubscription, which needs only org:read, and ListOffers, which needs no
// membership at all.
service BillingService {
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (GetPaymentStatusResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (GetSubscriptionResponse);
  // Charge now and extend the paid period. With a working saved card the charge
  // is silent; otherwise this returns a checkout that also stores a new card,
  // so it doubles as the "my card stopped working" path.
  rpc RenewNow(RenewNowRequest) returns (RenewNowResponse);
  // Stop renewals and forget the saved card. YooKassa requires this to be
  // self-service before it enables recurring charges at all.
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse);
  // Newest first. org:manage_billing.
  rpc ListPayments(ListPaymentsRequest) returns (ListPaymentsResponse);
  // Public price list for the current price version. Any authenticated user.
  rpc ListOffers(ListOffersRequest) returns (ListOffersResponse);
}

message SubscribeRequest {
  string org_id = 1;
  string tier = 2;             // pro | team
  string period = 3;           // month | year
  // Client-generated UUID, stable across retries of the same intent. The
  // server derives the payment id from it, so a repeated click reuses the
  // existing checkout instead of opening a second one.
  string idempotency_key = 4;
}

message SubscribeResponse {
  string payment_id = 1;
  string confirmation_url = 2;
  int64 amount_minor = 3;
  string currency = 4;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message GetPaymentStatusResponse {
  string payment_id = 1;
  string status = 2;           // creating | pending | succeeded | canceled | needs_attention
  string cancel_reason = 3;
  Subscription subscription = 4; // set once the plan has been applied
}

message GetSubscriptionRequest {
  string org_id = 1;
}

message GetSubscriptionResponse {
  Subscription subscription = 1; // unset when the org never subscribed
}

message RenewNowRequest {
  string org_id = 1;
  // A manual renewal spends no rung of the retry ladder, so it is addressed by
  // this key rather than by an attempt number: that is what makes a repeated
  // click land on the same payment.
  string idempotency_key = 2;
}

message RenewNowResponse {
  string payment_id = 1;
  // Empty when a saved card was charged without the customer.
  string confirmation_url = 2;
  Subscription subscription = 3;
}

message CancelSubscriptionRequest {
  string org_id = 1;
}

message CancelSubscriptionResponse {
  Subscription subscription = 1;
}

message Subscription {
  string id = 1;
  string tier = 2;
  string period = 3;
  int32 seats = 4;
  string status = 5;           // active | past_due | canceled | expired
  google.protobuf.Timestamp current_period_end = 6;
  // Human-readable only, e.g. "Visa •••• 4242". Empty means no saved card.
  string payment_method_title = 7;
  google.protobuf.Timestamp next_charge_at = 8;
  int32 charge_attempts = 9;
  google.protobuf.Timestamp canceled_at = 10;
  // The version this subscription renews at, which is not the current list: a
  // price change never reaches a subscription already sold.
  string price_version = 11;
  // What the next renewal costs, resolved from price_version.
  int64 amount_minor = 12;
  string currency = 13;
}

message ListPaymentsRequest {
  string org_id = 1;
  // 0 means 20; anything above 100 is capped.
  int32 limit = 2;
}

message ListPaymentsResponse {
  repeated Payment payments = 1;
}

// Payment is the customer-facing view of one ledger row. The provider ids, the
// idempotence key and the checkout URLs stay server-side.
message Payment {
  string id = 1;
  string kind = 2;             // initial | renewal
  string tier = 3;
  string period = 4;
  int64 amount_minor = 5;
  string currency = 6;
  string status = 7;           // creating | pending | succeeded | canceled | needs_attention
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp paid_period_end = 9;
  string cancel_reason = 10;
}

message ListOffersRequest {}

message ListOffersResponse {
  repeated Offer offers = 1;
  string price_version = 2;
}

message Offer {
  string tier = 1;             // pro | team
  string period = 2;           // month | year
  int64 amount_minor = 3;
  string currency = 4;         // RUB
}
