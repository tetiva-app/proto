syntax = "proto3";

package gophercourier.platform.v1;

import "google/protobuf/timestamp.proto";

// PlatformService is the Platform Admin (Instance Operator) gRPC surface.
// Combines read-only support API with tightly-bounded force-* mutations.
//
// Per spec [07] + [12] §M11:
//   * Every method requires the caller's JWT to carry IsPlatformStaff=true
//     (enforced by PlatformStaffGuard interceptor).
//   * Every read emits a `platform.read` audit row server-side.
//   * Every force-* mutation requires `Reason` (10..500 chars after trim) and
//     emits a matching `platform.*` audit row PLUS cascaded
//     `auth.session_revoked` per killed session.
service PlatformService {
  // Read.
  rpc ListOrgs(PlatformServiceListOrgsRequest) returns (PlatformServiceListOrgsResponse);
  rpc GetOrg(PlatformServiceGetOrgRequest) returns (PlatformServiceGetOrgResponse);
  rpc ListUsers(PlatformServiceListUsersRequest) returns (PlatformServiceListUsersResponse);
  rpc GetUser(PlatformServiceGetUserRequest) returns (PlatformServiceGetUserResponse);
  rpc ListAudit(PlatformServiceListAuditRequest) returns (PlatformServiceListAuditResponse);

  // Write (force-*).
  rpc ForceResetPassword(PlatformServiceForceResetPasswordRequest)
      returns (PlatformServiceForceResetPasswordResponse);
  rpc ForceTransferOrg(PlatformServiceForceTransferOrgRequest)
      returns (PlatformServiceForceTransferOrgResponse);
  rpc ForceRevokeSessions(PlatformServiceForceRevokeSessionsRequest)
      returns (PlatformServiceForceRevokeSessionsResponse);

  // ForceRevokeSession kills one session of the target user. Idempotent — an
  // already-revoked session returns was_already_revoked=true without error.
  rpc ForceRevokeSession(PlatformServiceForceRevokeSessionRequest)
      returns (PlatformServiceForceRevokeSessionResponse);
  rpc ForceDeleteUser(PlatformServiceForceDeleteUserRequest)
      returns (PlatformServiceForceDeleteUserResponse);

  // ForceDeleteOrg soft-deletes a non-personal org with cascade. Personal orgs
  // are rejected with FailedPrecondition. Reason is required (10..500 chars).
  rpc ForceDeleteOrg(PlatformServiceForceDeleteOrgRequest)
      returns (PlatformServiceForceDeleteOrgResponse);

  // AdminVerifyEmail flips email_verified=true without involving the user's
  // verification-email flow. Idempotent — already-verified users return
  // was_already_verified=true without error.
  rpc AdminVerifyEmail(PlatformServiceAdminVerifyEmailRequest)
      returns (PlatformServiceAdminVerifyEmailResponse);

  // SetPlan assigns a billing plan to an org. Both upgrade and downgrade go
  // through this single call; nothing is deleted on downgrade.
  rpc SetPlan(PlatformServiceSetPlanRequest)
      returns (PlatformServiceSetPlanResponse);

  // GetOverview returns instance-wide counters for the platform dashboard.
  rpc GetOverview(PlatformServiceGetOverviewRequest)
      returns (PlatformServiceGetOverviewResponse);

  // Force member ops bypass org RBAC. Personal orgs are rejected; the last
  // admin and the owner's own role are protected.
  rpc ForceAddOrgMember(PlatformServiceForceAddOrgMemberRequest)
      returns (PlatformServiceForceAddOrgMemberResponse);
  rpc ForceChangeOrgMemberRole(PlatformServiceForceChangeOrgMemberRoleRequest)
      returns (PlatformServiceForceChangeOrgMemberRoleResponse);
  rpc ForceRemoveOrgMember(PlatformServiceForceRemoveOrgMemberRequest)
      returns (PlatformServiceForceRemoveOrgMemberResponse);
}

// ---- Request / Response shapes ----

message PlatformServiceListOrgsRequest {
  bool include_personal = 1;
  bool include_deleted = 2;
  string cursor = 3;
  int32 limit = 4;
  // Case-insensitive substring match over the org name or its slug.
  string name_substring = 5;
  // "" = off. free|pro|team|business, matched against the stored plan.
  string plan = 6;
  // "" = off. active|past_due|canceled|expired|none, by the newest subscription.
  string subscription_status = 7;
}

message PlatformServiceOrgRow {
  string id = 1;
  string name = 2;
  string slug = 3;
  string owner_user_id = 4;
  bool is_personal = 5;
  int32 member_count = 6;
  int32 workspace_count = 7;
  google.protobuf.Timestamp last_activity_at = 8;
  bool is_deleted = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  // Owner's email at the time of listing. Empty string if the owner user
  // is deleted or missing.
  string owner_email = 12;
  // Assigned billing tier; empty is normalized to "free" on the wire. Judge
  // whether it is still live by plan_until — this is not grace-adjusted.
  string plan = 13;
  int32 seats = 14;
  google.protobuf.Timestamp plan_until = 15;
  // none | active | past_due | canceled | expired — status of the newest
  // subscription, "none" if the org never had one.
  string subscription_status = 16;
  google.protobuf.Timestamp current_period_end = 17;
  // True if the org ever had a subscription, i.e. ever paid.
  bool has_paid = 18;
}

message PlatformServiceListOrgsResponse {
  repeated PlatformServiceOrgRow orgs = 1;
  string next_cursor = 2;
}

message PlatformServiceGetOrgRequest {
  string org_id = 1;
}

message PlatformServiceOrgMember {
  string user_id = 1;
  string email = 2;
  string name = 3;
  string role_id = 4;
  string role_name = 5;
  google.protobuf.Timestamp joined_at = 6;
  google.protobuf.Timestamp last_login_at = 7;
  // True if the user's email is verified. Lets the Platform admin UI hide
  // the Verify Email action for already-verified members.
  bool email_verified = 8;
}

message PlatformServiceWorkspace {
  string id = 1;
  string name = 2;
  string visibility = 3;
  int32 member_count = 4;
  google.protobuf.Timestamp last_sync_at = 5;
}

message PlatformServiceInvite {
  string id = 1;
  string email = 2;
  string role_id = 3;
  int32 max_uses = 4;
  int32 used_count = 5;
  google.protobuf.Timestamp expires_at = 6;
  string status = 7;
  // Human-readable role name (e.g. "Admin", "Member"). Sourced from
  // authz.BuiltinRoles for builtin roles. Empty for unknown role IDs —
  // UI falls back to role_id in that case.
  string role_name = 8;
}

message PlatformServiceOrg {
  string id = 1;
  string name = 2;
  string slug = 3;
  string owner_user_id = 4;
  bool is_personal = 5;
  bool is_deleted = 6;
  int32 version = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string plan = 10;
  int32 seats = 11;
  google.protobuf.Timestamp plan_until = 12;
  string subscription_status = 13;
  google.protobuf.Timestamp current_period_end = 14;
  bool has_paid = 15;
}

message PlatformServiceGetOrgResponse {
  PlatformServiceOrg org = 1;
  repeated PlatformServiceOrgMember members = 2;
  repeated PlatformServiceWorkspace workspaces = 3;
  repeated PlatformServiceInvite invites = 4;
}

message PlatformServiceListUsersRequest {
  string email_substring = 1;
  bool include_deleted = 2;
  string cursor = 3;
  int32 limit = 4;
  // "" | "created_desc" (default) | "activity_desc"
  string sort = 5;
  // 0 = off. Keeps only users whose last_activity_at >= now - N days.
  int32 active_within_days = 6;
  // 0 = off. Keeps only users registered within the last N days; >365 is
  // clamped to 365.
  int32 created_within_days = 7;
  // Keeps only users whose email is not verified.
  bool unverified_only = 8;
}

message PlatformServiceUserRow {
  string id = 1;
  string email = 2;
  string name = 3;
  bool email_verified = 4;
  bool is_platform_staff = 5;
  bool is_deleted = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_login_at = 8;
  int32 org_count = 9;
  // max(last_login_at, MAX(sessions.created_at)); unset if never active.
  google.protobuf.Timestamp last_activity_at = 10;
  // revoked_at unset && expires_at > now.
  int32 active_sessions = 11;
  // Distinct client_id over sessions retained within the refresh-token TTL
  // (30 days in prod) — older devices fall out with their sessions.
  int32 device_count = 12;
  // Best plan across the user's orgs, grace-aware. free|pro|team|business.
  string max_plan = 13;
  // True if the user is the billing customer of any subscription.
  bool has_paid = 14;
}

message PlatformServiceListUsersResponse {
  repeated PlatformServiceUserRow users = 1;
  string next_cursor = 2;
}

message PlatformServiceGetUserRequest {
  string user_id = 1;
}

message PlatformServiceUserMembership {
  string org_id = 1;
  string org_name = 2;
  string role_id = 3;
  string role_name = 4;
  google.protobuf.Timestamp joined_at = 5;
}

message PlatformServiceUserSession {
  string id = 1;
  string client_id = 2;
  string user_agent = 3;
  string ip = 4;
  google.protobuf.Timestamp last_used_at = 5;
  google.protobuf.Timestamp revoked_at = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message PlatformServiceUser {
  string id = 1;
  string email = 2;
  string name = 3;
  bool email_verified = 4;
  bool is_platform_staff = 5;
  bool is_deleted = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp last_login_at = 8;
  google.protobuf.Timestamp last_activity_at = 9;
  int32 active_sessions = 10;
  // Distinct client_id over sessions retained within the refresh-token TTL
  // (30 days in prod) — older devices fall out with their sessions.
  int32 device_count = 11;
  string max_plan = 12;
  bool has_paid = 13;
}

message PlatformServiceGetUserResponse {
  PlatformServiceUser user = 1;
  repeated PlatformServiceUserMembership memberships = 2;
  repeated PlatformServiceUserSession sessions = 3;
}

message PlatformServiceAuditFilter {
  string org_id = 1;
  string workspace_id = 2;
  string actor_user_id = 3;
  string action = 4;
  string target_id = 5;
  google.protobuf.Timestamp from = 6;
  google.protobuf.Timestamp to = 7;
}

message PlatformServiceAuditEntry {
  google.protobuf.Timestamp timestamp = 1;
  string action = 2;
  string actor_type = 3;
  string actor_user_id = 4;
  string actor_name = 5;
  string actor_ip = 6;
  string actor_user_agent = 7;
  string actor_session_id = 8;
  string org_id = 9;
  string workspace_id = 10;
  string target_type = 11;
  string target_id = 12;
  string target_name = 13;
  string metadata_json = 14;
}

message PlatformServiceListAuditRequest {
  PlatformServiceAuditFilter filter = 1;
  int32 limit = 2;
  string cursor = 3;
}

message PlatformServiceListAuditResponse {
  repeated PlatformServiceAuditEntry entries = 1;
  string next_cursor = 2;
}

message PlatformServiceForceResetPasswordRequest {
  string target_user_id = 1;
  string new_password = 2;
  bool revoke_sessions = 3;
  string reason = 4;
}

message PlatformServiceForceResetPasswordResponse {
  string user_id = 1;
  int32 sessions_revoked = 2;
}

message PlatformServiceForceTransferOrgRequest {
  string org_id = 1;
  string new_owner_user_id = 2;
  string reason = 3;
}

message PlatformServiceForceTransferOrgResponse {
  string org_id = 1;
  string previous_owner_id = 2;
  string new_owner_id = 3;
  int32 org_version = 4;
  bool new_owner_was_member = 5;
}

message PlatformServiceForceRevokeSessionsRequest {
  string target_user_id = 1;
  string reason = 2;
}

message PlatformServiceForceRevokeSessionsResponse {
  string user_id = 1;
  int32 sessions_revoked = 2;
}

message PlatformServiceForceRevokeSessionRequest {
  string target_user_id = 1;
  string session_id = 2;
  string reason = 3;
}

message PlatformServiceForceRevokeSessionResponse {
  string user_id = 1;
  string session_id = 2;
  bool was_already_revoked = 3;
}

message PlatformServiceForceDeleteUserRequest {
  string target_user_id = 1;
  string reason = 2;
}

message PlatformServiceForceDeleteUserResponse {
  string user_id = 1;
  int32 sessions_revoked = 2;
  string personal_org_id = 3;
  int32 non_personal_orgs_left = 4;
}

message PlatformServiceForceDeleteOrgRequest {
  string org_id = 1;
  string reason = 2;
}

message PlatformServiceForceDeleteOrgResponse {
  string org_id = 1;
  int32 workspaces_deleted = 2;
  int32 memberships_pruned = 3;
}

message PlatformServiceAdminVerifyEmailRequest {
  string target_user_id = 1;
}

message PlatformServiceAdminVerifyEmailResponse {
  string user_id = 1;
  bool was_already_verified = 2;
}

message PlatformServiceSetPlanRequest {
  string org_id = 1;
  string plan = 2;                             // free | pro | team | business
  int32 seats = 3;                             // 0 → tier default
  google.protobuf.Timestamp plan_until = 4;    // unset = indefinite
  string reason = 5;                           // 10..500 chars
}

message PlatformServiceSetPlanResponse {
  string org_id = 1;
  string plan = 2;
  int32 seats = 3;
  google.protobuf.Timestamp plan_until = 4;
  int32 org_version = 5;
}

message PlatformServiceGetOverviewRequest {}

message PlatformServicePlanCount {
  string plan = 1;
  int32 count = 2;
}

message PlatformServiceGetOverviewResponse {
  int32 users_total = 1;
  int32 users_new_7d = 2;
  int32 users_new_30d = 3;
  int32 users_active_7d = 4;
  int32 users_active_30d = 5;
  int32 users_unverified = 6;
  // Non-personal, non-deleted.
  int32 orgs_total = 7;
  // All non-deleted orgs including personal ones; every tier is present.
  repeated PlatformServicePlanCount orgs_by_plan = 8;
  int32 subscriptions_active = 9;
  int32 subscriptions_past_due = 10;
  // Distinct orgs that ever had a subscription, i.e. ever paid.
  int32 paying_orgs = 11;
  // 8 newest non-deleted users with the same enrichment as ListUsers.
  repeated PlatformServiceUserRow recent_signups = 12;
}

message PlatformServiceForceAddOrgMemberRequest {
  string org_id = 1;
  string target_user_id = 2;
  string role_id = 3;
  string reason = 4;
}

message PlatformServiceForceAddOrgMemberResponse {
  string org_id = 1;
  string user_id = 2;
  string role_id = 3;
  bool already_member = 4;
  string previous_role = 5;
}

message PlatformServiceForceChangeOrgMemberRoleRequest {
  string org_id = 1;
  string target_user_id = 2;
  string new_role_id = 3;
  string reason = 4;
}

message PlatformServiceForceChangeOrgMemberRoleResponse {
  string org_id = 1;
  string user_id = 2;
  string previous_role = 3;
  string new_role = 4;
}

message PlatformServiceForceRemoveOrgMemberRequest {
  string org_id = 1;
  string target_user_id = 2;
  string reason = 3;
}

message PlatformServiceForceRemoveOrgMemberResponse {
  string org_id = 1;
  string user_id = 2;
  string had_role = 3;
  int64 ws_memberships_removed = 4;
}
